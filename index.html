<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sınıf Yarışması</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0f1117;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .wrap{text-align:center;max-width:400px;width:100%}
  h1{font-size:2.6rem;font-weight:800;background:linear-gradient(135deg,#6c63ff,#ff6584);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:6px}
  p{color:#8892a4;margin-bottom:36px;font-size:.95rem}
  a{display:block;padding:16px;border-radius:12px;font-size:1.05rem;font-weight:700;
    text-decoration:none;margin-bottom:12px;transition:all .18s}
  .t{background:#6c63ff;color:#fff}
  .t:hover{background:#5a51e8;transform:translateY(-2px)}
  .s{background:#1a1d26;color:#e2e8f0;border:1px solid #2d3350}
  .s:hover{background:#22263a;transform:translateY(-2px)}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎮 Sınıf Yarışması</h1>
  <p>Hızlı ol, puanı kap!</p>
  <a href="teacher.html" class="t">👨‍🏫 Öğretmen Girişi</a>
  <a href="student.html" class="s">👨‍🎓 Öğrenci Girişi</a>
</div>
</body>
</html>
