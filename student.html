<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>mkakademics</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;touch-action:manipulation;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#1a1a2e;color:#fff;}
.screen{display:none;height:100vh;flex-direction:column;}
.screen.active{display:flex;}
:root{--red:#e21b3c;--blue:#1368ce;--yellow:#d89e00;--green:#26890c;--accent:#e040fb;}

/* JOIN */
#screen-join{align-items:center;justify-content:center;padding:20px;gap:14px;background:linear-gradient(135deg,#1a1a2e,#16213e);overflow-y:auto;}
.logo{font-size:2rem;font-weight:900;background:linear-gradient(to right,var(--accent),#7c4dff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.join-form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:11px;}
.input-field{width:100%;padding:13px 16px;background:#16213e;border:2px solid #2a2a4a;color:#fff;border-radius:13px;font-size:1rem;outline:none;text-align:center;transition:border-color .2s;}
.input-field:focus{border-color:var(--accent);}
.input-field::placeholder{color:#555;}
.pin-input{font-size:1.5rem;font-weight:700;letter-spacing:6px;text-transform:uppercase;}
.avatar-label{font-size:.82rem;color:#888;text-align:center;}
.avatar-grid{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;}
.av-btn{width:46px;height:46px;background:#16213e;border:2px solid #2a2a4a;border-radius:11px;font-size:1.4rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.av-btn.selected{border-color:var(--accent);background:rgba(224,64,251,.2);}
.btn-join{width:100%;padding:15px;background:linear-gradient(135deg,var(--accent),#7c4dff);color:#fff;border:none;border-radius:13px;font-size:1.1rem;font-weight:700;cursor:pointer;transition:all .15s;letter-spacing:.4px;}
.btn-join:active{transform:scale(.97);}
.btn-join:disabled{opacity:.5;cursor:not-allowed;}
.err-msg{color:#f87171;font-size:.82rem;text-align:center;min-height:18px;}

/* WAIT */
#screen-wait{align-items:center;justify-content:center;gap:16px;background:linear-gradient(135deg,#1a1a2e,#16213e);text-align:center;padding:24px;}
.wait-av{font-size:4rem;}
.wait-nm{font-size:1.3rem;font-weight:700;}
.wait-msg{color:#aaa;font-size:.95rem;}
.dots{display:flex;gap:7px;}
.dot{width:9px;height:9px;background:var(--accent);border-radius:50%;animation:bounce 1.2s infinite ease-in-out;}
.dot:nth-child(2){animation-delay:.2s;}
.dot:nth-child(3){animation-delay:.4s;}
@keyframes bounce{0%,100%{transform:translateY(0);opacity:.4;}50%{transform:translateY(-8px);opacity:1;}}

/* QUESTION */
#screen-question{background:#0f0f23;}
.timer-bar-wrap{height:9px;background:#2a2a4a;flex-shrink:0;}
.timer-bar{height:100%;background:var(--accent);transition:width 1s linear;border-radius:0 4px 4px 0;}
.q-info-bar{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;background:rgba(0,0,0,.35);flex-shrink:0;}
.q-num-txt{font-size:.82rem;color:#aaa;}
.q-time-txt{font-size:1rem;font-weight:700;}
.answer-grid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:13px;}
.answer-grid.two{grid-template-columns:1fr;}
.answer-tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border-radius:16px;border:none;color:#fff;font-size:1rem;font-weight:700;cursor:pointer;padding:16px;user-select:none;transition:transform .1s,opacity .15s;}
.answer-tile:active{transform:scale(.94);}
.answer-tile.oa{background:var(--red);} .answer-tile.ob{background:var(--blue);} .answer-tile.oc{background:var(--yellow);color:#111;} .answer-tile.od{background:var(--green);}
.tile-shape{font-size:1.4rem;}
.tile-text{font-size:.95rem;line-height:1.25;text-align:center;word-break:break-word;}
.s-q-text{padding:12px 14px 4px;font-size:1.05rem;font-weight:700;line-height:1.35;color:#fff;flex-shrink:0;max-height:30vh;overflow-y:auto;}

/* MATCHING */
.matching-ui{flex:1;display:flex;flex-direction:column;padding:10px 13px;gap:8px;overflow-y:auto;}
.match-cols{display:flex;gap:8px;flex:1;}
.match-col{flex:1;display:flex;flex-direction:column;gap:7px;}
.match-col-label{font-size:.72rem;color:#888;text-align:center;margin-bottom:2px;}
.match-item{padding:11px 10px;border-radius:12px;border:2px solid #2a2a4a;background:#16213e;color:#fff;font-size:.88rem;text-align:center;cursor:pointer;transition:all .15s;user-select:none;word-break:break-word;}
.match-item:active{transform:scale(.96);}
.match-item.selected{border-color:var(--accent);background:rgba(224,64,251,.18);box-shadow:0 0 10px rgba(224,64,251,.4);}
.match-item.paired-0{border-color:var(--red);background:rgba(226,27,60,.18);}
.match-item.paired-1{border-color:var(--blue);background:rgba(19,104,206,.18);}
.match-item.paired-2{border-color:var(--yellow);background:rgba(216,158,0,.18);}
.match-item.paired-3{border-color:var(--green);background:rgba(38,137,12,.18);}
.match-item.paired-4{border-color:#ff9800;background:rgba(255,152,0,.18);}
.match-item.paired-5{border-color:#9c27b0;background:rgba(156,39,176,.18);}
.match-item.paired-6{border-color:#00bcd4;background:rgba(0,188,212,.18);}
.match-item.paired-7{border-color:#8bc34a;background:rgba(139,195,74,.18);}
.match-submit-wrap{padding:0 4px 4px;}
/* ORDERING */
.ordering-ui{flex:1;display:flex;flex-direction:column;padding:10px 13px;gap:8px;overflow-y:auto;}
.order-items-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;flex:1;}
.order-item-btn{position:relative;padding:14px 10px;border-radius:12px;border:2px solid #2a2a4a;background:#16213e;color:#fff;font-size:.9rem;text-align:center;cursor:pointer;transition:all .15s;user-select:none;word-break:break-word;display:flex;align-items:center;justify-content:center;}
.order-item-btn:active{transform:scale(.96);}
.order-item-btn.numbered{border-color:var(--accent);background:rgba(224,64,251,.15);}
.order-badge{position:absolute;top:5px;right:5px;width:22px;height:22px;background:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:900;color:#fff;}
.order-submit-wrap{padding:0 4px 4px;}
/* Common submit button */
.action-submit-btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--accent),#7c4dff);color:#fff;border:none;border-radius:13px;font-size:1rem;font-weight:700;cursor:pointer;transition:all .15s;}
.action-submit-btn:active{transform:scale(.97);}
.action-submit-btn:disabled{opacity:.45;cursor:not-allowed;}
/* ANSWERED */
#screen-answered{align-items:center;justify-content:center;gap:14px;background:#0f0f23;text-align:center;padding:24px;}
.answered-icon{font-size:4rem;}
.answered-txt{font-size:1.1rem;color:#aaa;}

/* FEEDBACK */
#screen-feedback{align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;}
#screen-feedback.correct{background:linear-gradient(135deg,#0a2a0a,#1a1a2e);}
#screen-feedback.wrong{background:linear-gradient(135deg,#2a0a0a,#1a1a2e);}
#screen-feedback.timeout{background:linear-gradient(135deg,#1a1a0a,#1a1a2e);}
.fb-icon{font-size:5rem;animation:popIn .4s ease-out;}
.fb-verdict{font-size:1.8rem;font-weight:900;}
.fb-verdict.c{color:#4ade80;} .fb-verdict.w{color:#f87171;} .fb-verdict.t{color:#fbbf24;}
.fb-pts{font-size:2.5rem;font-weight:900;color:var(--accent);}
.fb-streak{font-size:1.2rem;min-height:28px;}
.fb-rank{font-size:.88rem;color:#aaa;}
@keyframes popIn{from{transform:scale(.4);opacity:0;}to{transform:scale(1);opacity:1;}}

/* PODIUM */
#screen-podium{align-items:center;justify-content:center;padding:20px;gap:14px;background:linear-gradient(135deg,#1a1a2e,#0f0f23);text-align:center;overflow-y:auto;}
.my-rank-box{background:rgba(224,64,251,.12);border:2px solid var(--accent);border-radius:16px;padding:14px 28px;}
.my-rank-label{font-size:.85rem;color:#aaa;margin-bottom:3px;}
.my-rank-num{font-size:2.5rem;font-weight:900;}
.my-rank-score{font-size:.9rem;color:#aaa;}
.podium-title{font-size:1.4rem;font-weight:700;}
.mini-podium{display:flex;gap:8px;align-items:flex-end;}
.mini-slot{display:flex;flex-direction:column;align-items:center;gap:4px;}
.mini-av{font-size:1.6rem;} .mini-nm{font-size:.7rem;max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mini-block{display:flex;align-items:center;justify-content:center;font-size:.9rem;font-weight:900;color:rgba(0,0,0,.5);border-radius:7px 7px 0 0;width:68px;}
</style>
</head>
<body>

<!-- JOIN -->
<div id="screen-join" class="screen active">
  <div class="logo">mkakademics</div>
  <div class="join-form">
    <input id="pin-input" class="input-field pin-input" maxlength="6" placeholder="PIN KOD" autocomplete="off" autocorrect="off" spellcheck="false" oninput="this.value=this.value.toUpperCase()">
    <input id="name-input" class="input-field" maxlength="20" placeholder="Adın">
    <div class="avatar-label">Avatar seç</div>
    <div class="avatar-grid" id="avatar-grid"></div>
    <div class="err-msg" id="join-err"></div>
    <button class="btn-join" id="btn-join" onclick="joinGame()">Katıl 🚀</button>
  </div>
</div>

<!-- WAIT -->
<div id="screen-wait" class="screen">
  <div class="wait-av" id="wait-av">😊</div>
  <div class="wait-nm" id="wait-nm">Oyuncu</div>
  <div class="wait-msg">Öğretmen oyunu başlatana kadar bekle</div>
  <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
</div>

<!-- QUESTION -->
<div id="screen-question" class="screen">
  <div class="timer-bar-wrap"><div class="timer-bar" id="timer-bar"></div></div>
  <div class="q-info-bar">
    <span class="q-num-txt" id="s-q-num">1 / 1</span>
    <span class="q-time-txt" id="s-time">20</span>
  </div>
  <div class="s-q-text" id="s-q-text"></div>
  <div class="answer-grid" id="answer-grid"></div>
</div>

<!-- ANSWERED -->
<div id="screen-answered" class="screen">
  <div class="answered-icon">⏳</div>
  <div class="answered-txt">Cevabın alındı!<br>Sonuçlar bekleniyor…</div>
</div>

<!-- FEEDBACK -->
<div id="screen-feedback" class="screen">
  <div class="fb-icon" id="fb-icon">✅</div>
  <div class="fb-verdict" id="fb-verdict">Doğru!</div>
  <div class="fb-pts" id="fb-pts">+850</div>
  <div class="fb-streak" id="fb-streak"></div>
  <div class="fb-rank" id="fb-rank"></div>
</div>

<!-- PODIUM -->
<div id="screen-podium" class="screen">
  <div class="podium-title">🏆 Oyun Bitti!</div>
  <div class="my-rank-box">
    <div class="my-rank-label">Sıran</div>
    <div class="my-rank-num" id="my-rank">—</div>
    <div class="my-rank-score" id="my-score">0 puan</div>
  </div>
  <div class="mini-podium" id="mini-podium"></div>
  <div style="color:#666;font-size:.82rem;text-align:center">Öğretmenin ekranında tüm sonuçlar görünüyor</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const AVATARS=['😊','🦁','🐯','🐧','🦊','🐸','🦄','🐬','🦋','🎃','👾','🤖','🦅','🐙','🌟','🔥'];

let myId=null, myName='', myAvatar='😊', myScore=0, myStreak=0;
let roomCode='', currentRoom=null, currentQIdx=-1;
let hasAnswered=false, qStart=0, pendingFeedback=null;
let timerIv=null, realtimeChannel=null;
let roomQuestions=null; // Realtime UPDATE yükünde büyük JSONB (questions) gelmeyebilir; katılırken önbelleğe alınır
// Matching state
let matchLeftSelected=null, matchPairs={}, matchRightItems=[];
// Ordering state
let orderItems=[], orderSelected=[];

// ========== AVATAR ==========
function initAvatars(){
  const g=document.getElementById('avatar-grid');
  g.innerHTML=AVATARS.map((a,i)=>`<button class="av-btn ${i===0?'selected':''}" onclick="pickAvatar(${i},'${a}')">${a}</button>`).join('');
  myAvatar=AVATARS[0];
}
function pickAvatar(i,a){
  document.querySelectorAll('.av-btn').forEach((b,j)=>b.classList.toggle('selected',j===i));
  myAvatar=a;
}

// ========== JOIN ==========
async function joinGame(){
  const pin=document.getElementById('pin-input').value.trim().toUpperCase();
  const name=document.getElementById('name-input').value.trim();
  const err=document.getElementById('join-err');
  err.textContent='';
  if(pin.length!==6){err.textContent='6 haneli PIN gir';return;}
  if(name.length<2){err.textContent='Adın en az 2 karakter olmalı';return;}
  document.getElementById('btn-join').disabled=true;

  const{data:room,error}=await sb.from('rooms').select('*').eq('code',pin).single();
  if(error||!room){err.textContent='❌ Oda bulunamadı – PIN doğru mu?';document.getElementById('btn-join').disabled=false;return;}
  if(room.phase!=='lobby'){err.textContent='⚠️ Bu oyun zaten başladı';document.getElementById('btn-join').disabled=false;return;}

  const{data:p,error:e2}=await sb.from('participants').insert({
    room_code:pin,name,avatar:myAvatar,score:0,streak:0
  }).select().single();
  if(e2){
    err.textContent=e2.code==='23505'?'⚠️ Bu isim alınmış, başka isim dene':'❌ '+e2.message;
    document.getElementById('btn-join').disabled=false;return;
  }
  myId=p.id; myName=name; roomCode=pin; currentRoom=room;
  roomQuestions=Array.isArray(room.questions)?room.questions:null;
  document.getElementById('wait-av').textContent=myAvatar;
  document.getElementById('wait-nm').textContent=myName;
  showScreen('wait');
  subscribeRoom(pin);
}

// ========== REALTIME ==========
function subscribeRoom(code){
  if(realtimeChannel)sb.removeChannel(realtimeChannel);
  realtimeChannel=sb.channel('student-'+code+'-'+Date.now())
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'rooms',filter:`code=eq.${code}`},p=>{
      handleRoom(p.new);
    })
    .subscribe(async()=>{
      // check current state after subscribe
      const{data}=await sb.from('rooms').select('*').eq('code',code).single();
      if(data&&data.phase!=='lobby')handleRoom(data);
    });
}

async function ensureQuestions(room){
  if(Array.isArray(room.questions)&&room.questions.length){roomQuestions=room.questions;return room;}
  if(!roomQuestions){
    const{data}=await sb.from('rooms').select('questions').eq('code',roomCode).single();
    if(data&&Array.isArray(data.questions))roomQuestions=data.questions;
  }
  return {...room,questions:roomQuestions||[]};
}

async function handleRoom(rawRoom){
  const room=await ensureQuestions(rawRoom);
  currentRoom=room;
  if(room.phase==='question'){
    const idx=room.current_question;
    if(idx!==currentQIdx){
      currentQIdx=idx; hasAnswered=false; pendingFeedback=null;
      qStart=new Date(room.question_start_time).getTime();
      showQuestion(room);
    }
  } else if(room.phase==='results'){
    if(pendingFeedback){
      const{isCorrect,earned}=pendingFeedback; pendingFeedback=null;
      showFeedback(isCorrect,earned,true);
    } else if(!hasAnswered){
      showFeedback(false,0,false);
    }
  } else if(room.phase==='podium'){
    fetchAndShowPodium();
  }
}

// ========== QUESTION ==========
function showQuestion(room){
  const q=room.questions[room.current_question];
  if(!q){console.error('Soru bulunamadı',room.current_question,room.questions);return;}
  document.getElementById('s-q-num').textContent=`${room.current_question+1} / ${room.questions.length}`;
  document.getElementById('s-q-text').textContent=q.text||'';
  const grid=document.getElementById('answer-grid');

  if(q.type==='matching'){
    // Reset matching state
    matchLeftSelected=null; matchPairs={};
    const leftItems=(q.pairs||[]).map(p=>p.l);
    matchRightItems=[...(q.pairs||[]).map(p=>p.r)].sort(()=>Math.random()-.5);
    grid.className=''; grid.style.display='contents';
    grid.innerHTML=`<div class="matching-ui">
      <div class="match-cols">
        <div class="match-col">
          <div class="match-col-label">Sol</div>
          ${leftItems.map((item,i)=>`<div class="match-item" id="ml${i}" onclick="matchSelectLeft(${i})">${esc(item)}</div>`).join('')}
        </div>
        <div class="match-col">
          <div class="match-col-label">Sağ</div>
          ${matchRightItems.map((item,i)=>`<div class="match-item" id="mr${i}" onclick="matchSelectRight(${i})">${esc(item)}</div>`).join('')}
        </div>
      </div>
      <div class="match-submit-wrap">
        <button class="action-submit-btn" id="match-submit-btn" disabled onclick="submitMatching()">Gönder ✓</button>
      </div>
    </div>`;
  } else if(q.type==='ordering'){
    // Reset ordering state
    orderSelected=[];
    orderItems=[...(q.items||[])].sort(()=>Math.random()-.5);
    grid.className=''; grid.style.display='contents';
    grid.innerHTML=`<div class="ordering-ui">
      <div class="order-items-grid" id="order-grid">
        ${orderItems.map((item,i)=>`<div class="order-item-btn" id="oi${i}" onclick="tapOrderItem(${i})">${esc(item)}</div>`).join('')}
      </div>
      <div class="order-submit-wrap">
        <button class="action-submit-btn" id="order-submit-btn" disabled onclick="submitOrdering()">Gönder ✓</button>
      </div>
    </div>`;
  } else {
    const isTF=q.type==='tf';
    const opts=isTF?['Doğru','Yanlış']:(q.options||[]);
    const OC=['oa','ob','oc','od'], SH=['▲','◆','●','■'];
    grid.className='answer-grid'+(isTF?' two':'');
    grid.style.display='';
    grid.innerHTML=opts.map((opt,i)=>`
      <button class="answer-tile ${OC[i]}" onclick="submitAnswerIdx(${i})">
        <span class="tile-shape">${SH[i]}</span>
        <span class="tile-text">${esc(opt)}</span>
      </button>`).join('');
  }
  showScreen('question');
  startStudentTimer(q.time||20);
}

// ========== MATCHING INTERACTION ==========
function matchSelectLeft(idx){
  if(hasAnswered)return;
  // If already paired, unpair first
  if(matchPairs[idx]!==undefined){
    const rIdx=matchPairs[idx];
    delete matchPairs[idx];
    document.getElementById('ml'+idx).className='match-item';
    document.getElementById('mr'+rIdx).className='match-item';
    matchLeftSelected=null;
    _updateMatchSubmit(); return;
  }
  matchLeftSelected=idx;
  document.querySelectorAll('[id^="ml"]').forEach(el=>{
    const i=+el.id.slice(2);
    if(matchPairs[i]===undefined) el.className='match-item'+(i===idx?' selected':'');
  });
}
function matchSelectRight(rIdx){
  if(hasAnswered||matchLeftSelected===null)return;
  // If right item already paired to something, unpair it first
  for(const [lk,rv] of Object.entries(matchPairs)){
    if(rv===rIdx){
      delete matchPairs[lk];
      document.getElementById('ml'+lk).className='match-item';
      document.getElementById('mr'+rIdx).className='match-item';
    }
  }
  const colorIdx=Object.keys(matchPairs).length;
  matchPairs[matchLeftSelected]=rIdx;
  document.getElementById('ml'+matchLeftSelected).className=`match-item paired-${colorIdx}`;
  document.getElementById('mr'+rIdx).className=`match-item paired-${colorIdx}`;
  matchLeftSelected=null;
  document.querySelectorAll('[id^="ml"]').forEach(el=>{ if(!el.className.includes('paired')) el.className='match-item'; });
  _updateMatchSubmit();
}
function _updateMatchSubmit(){
  const q=currentRoom.questions[currentQIdx];
  const total=(q.pairs||[]).length;
  const btn=document.getElementById('match-submit-btn');
  if(btn) btn.disabled=Object.keys(matchPairs).length<total;
}

// ========== ORDERING INTERACTION ==========
function tapOrderItem(idx){
  if(hasAnswered)return;
  const pos=orderSelected.indexOf(idx);
  if(pos!==-1){
    // Deselect: remove and re-number following items
    orderSelected.splice(pos,1);
  } else {
    orderSelected.push(idx);
  }
  _renderOrderItems();
  const q=currentRoom.questions[currentQIdx];
  const total=(q.items||[]).length;
  const btn=document.getElementById('order-submit-btn');
  if(btn) btn.disabled=orderSelected.length<total;
}
function _renderOrderItems(){
  orderItems.forEach((item,i)=>{
    const el=document.getElementById('oi'+i); if(!el)return;
    const pos=orderSelected.indexOf(i);
    if(pos!==-1){
      el.className='order-item-btn numbered';
      el.innerHTML=`<div class="order-badge">${pos+1}</div>${esc(item)}`;
    } else {
      el.className='order-item-btn';
      el.innerHTML=esc(item);
    }
  });
}

function startStudentTimer(seconds){
  if(timerIv)clearInterval(timerIv);
  let rem=seconds;
  const bar=document.getElementById('timer-bar'), tEl=document.getElementById('s-time');
  function tick(){
    const pct=(rem/seconds)*100;
    bar.style.width=pct+'%';
    tEl.textContent=rem;
    bar.style.background=rem<=5?'#e21b3c':rem<=10?'#d89e00':'var(--accent)';
    if(rem<=0){clearInterval(timerIv);timerIv=null;if(!hasAnswered){hasAnswered=true;_recordAnswer('—',false,0);}}
    else rem--;
  }
  tick(); timerIv=setInterval(tick,1000);
}

// ========== ANSWER ==========
async function _recordAnswer(answerStr,isCorrect,earned){
  const timeTaken=Date.now()-qStart;
  // Not: supabase-js sorgu nesnelerinde .catch() yok (sadece then) — hata {error} olarak döner
  try{
    if(isCorrect){
      myScore+=earned; myStreak++;
      const{error}=await sb.from('participants').update({score:myScore,streak:myStreak}).eq('id',myId);
      if(error)console.error('Puan güncellenemedi',error);
    } else {
      myStreak=0;
      const{error}=await sb.from('participants').update({streak:0}).eq('id',myId);
      if(error)console.error('Seri sıfırlanamadı',error);
    }
    const{error:aErr}=await sb.from('answers').insert({
      room_code:roomCode,participant_id:myId,question_index:currentQIdx,
      answer:answerStr,is_correct:isCorrect,earned_points:earned,
      time_taken_ms:Math.round(timeTaken)
    });
    if(aErr)console.error('Cevap kaydedilemedi',aErr);
  }catch(e){console.error(e);}
  pendingFeedback={isCorrect,earned};
  showScreen('answered');
}

function submitAnswerIdx(i){
  const q=currentRoom&&currentRoom.questions?currentRoom.questions[currentQIdx]:null;
  if(!q)return;
  const opts=q.type==='tf'?['Doğru','Yanlış']:(q.options||[]);
  submitAnswer(opts[i]??String(i),i);
}

async function submitAnswer(optText,optIdx){
  if(hasAnswered)return;
  hasAnswered=true;
  if(timerIv){clearInterval(timerIv);timerIv=null;}
  document.querySelectorAll('.answer-tile').forEach(b=>b.style.pointerEvents='none');
  const q=currentRoom.questions[currentQIdx];
  const timeTaken=Date.now()-qStart;
  const timeLimit=(q.time||20)*1000;
  const isCorrect=optIdx===q.correct;
  let earned=0;
  if(isCorrect){
    const maxP=1000,minP=100;
    earned=Math.round(maxP-(maxP-minP)*Math.min(timeTaken/timeLimit,1));
    earned=Math.round(earned*Math.min(1+(myStreak*.1),2.0));
  }
  await _recordAnswer(optText,isCorrect,earned);
}

async function submitMatching(){
  if(hasAnswered)return;
  hasAnswered=true;
  if(timerIv){clearInterval(timerIv);timerIv=null;}
  document.querySelectorAll('.match-item').forEach(el=>el.style.pointerEvents='none');
  const btn=document.getElementById('match-submit-btn'); if(btn)btn.disabled=true;
  const q=currentRoom.questions[currentQIdx];
  const timeTaken=Date.now()-qStart;
  const timeLimit=(q.time||30)*1000;
  // Build submitted pairs: {leftItem: rightItem}
  const correctPairs=q.pairs||[];
  let correctCount=0;
  for(const [lIdx,rIdx] of Object.entries(matchPairs)){
    const leftVal=correctPairs[+lIdx]?.l;
    const rightVal=matchRightItems[rIdx];
    if(correctPairs.some(cp=>cp.l===leftVal&&cp.r===rightVal)) correctCount++;
  }
  const isCorrect=correctCount===correctPairs.length;
  let earned=0;
  if(correctCount>0){
    const ratio=correctCount/correctPairs.length;
    const maxP=1000,minP=100;
    earned=Math.round((maxP-(maxP-minP)*Math.min(timeTaken/timeLimit,1))*ratio*Math.min(1+(myStreak*.1),2.0));
  }
  await _recordAnswer(isCorrect?'✓':'✗',isCorrect,earned);
}

async function submitOrdering(){
  if(hasAnswered)return;
  hasAnswered=true;
  if(timerIv){clearInterval(timerIv);timerIv=null;}
  document.querySelectorAll('.order-item-btn').forEach(el=>el.style.pointerEvents='none');
  const btn=document.getElementById('order-submit-btn'); if(btn)btn.disabled=true;
  const q=currentRoom.questions[currentQIdx];
  const timeTaken=Date.now()-qStart;
  const timeLimit=(q.time||30)*1000;
  const correctItems=q.items||[];
  // Map selected order back to actual item values
  const submittedOrder=orderSelected.map(i=>orderItems[i]);
  const isCorrect=submittedOrder.length===correctItems.length&&submittedOrder.every((v,i)=>v===correctItems[i]);
  let correctPos=submittedOrder.filter((v,i)=>v===correctItems[i]).length;
  let earned=0;
  if(correctPos>0){
    const ratio=correctPos/correctItems.length;
    const maxP=1000,minP=100;
    earned=Math.round((maxP-(maxP-minP)*Math.min(timeTaken/timeLimit,1))*ratio*Math.min(1+(myStreak*.1),2.0));
  }
  await _recordAnswer(isCorrect?'✓':'✗',isCorrect,earned);
}

function showFeedback(isCorrect,earned,answered){
  const fb=document.getElementById('screen-feedback');
  if(!answered) fb.className='screen active timeout';
  else fb.className='screen active '+(isCorrect?'correct':'wrong');
  document.getElementById('fb-icon').textContent=!answered?'⏰':isCorrect?'✅':'❌';
  const v=document.getElementById('fb-verdict');
  v.className='fb-verdict '+(isCorrect?'c':!answered?'t':'w');
  v.textContent=!answered?'Süre Doldu!':isCorrect?'Doğru!':'Yanlış!';
  document.getElementById('fb-pts').textContent=isCorrect?'+'+earned.toLocaleString()+' puan':'0 puan';
  document.getElementById('fb-streak').textContent=myStreak>1?'🔥 '+myStreak+' Seri!':myStreak===1?'⭐ İlk Puan':'';
  document.getElementById('fb-rank').textContent='';
  showScreen('feedback');
}

// ========== PODIUM ==========
async function fetchAndShowPodium(){
  const{data:lb}=await sb.from('participants').select('*').eq('room_code',roomCode).order('score',{ascending:false});
  if(!lb)return;
  const rank=lb.findIndex(p=>p.id===myId)+1;
  const me=lb.find(p=>p.id===myId);
  document.getElementById('my-rank').textContent=rank+'.';
  document.getElementById('my-score').textContent=(me?.score||0).toLocaleString()+' puan';
  const order=[lb[1],lb[0],lb[2]].filter(Boolean);
  const heights=['98px','128px','76px'],colors=['#c0c0c0','#ffd700','#cd7f32'],labels=['2','1','3'];
  document.getElementById('mini-podium').innerHTML=order.map((p,i)=>`
    <div class="mini-slot">
      <div class="mini-av">${p.avatar||'😊'}</div>
      <div class="mini-nm">${esc(p.name)}</div>
      <div class="mini-block" style="height:${heights[i]};background:${colors[i]}">${labels[i]}</div>
    </div>`).join('');
  showScreen('podium');
}

// ========== UTILS ==========
function showScreen(n){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById('screen-'+n).classList.add('active');}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;');}

// Pre-fill PIN from URL
const urlPin=new URLSearchParams(window.location.search).get('pin');
if(urlPin)document.getElementById('pin-input').value=urlPin.toUpperCase();

initAvatars();
</script>
