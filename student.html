<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Sınıf Yarışması</title>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#0f1117;--card:#1a1d26;--card2:#22263a;--accent:#6c63ff;--accent2:#ff6584;
  --green:#4ade80;--red:#f87171;--yellow:#fbbf24;--text:#e2e8f0;--muted:#8892a4;--border:#2d3350}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.hidden{display:none!important}
.scr{width:100%;max-width:480px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px}
h1{font-size:2.2rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:4px}
input{width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);
  border-radius:9px;padding:12px 16px;font-size:1rem;outline:none;transition:border .2s;text-align:center}
input:focus{border-color:var(--accent)}
.btn{width:100%;padding:14px;border-radius:10px;border:none;font-size:1rem;font-weight:700;
  cursor:pointer;transition:all .18s;margin-top:4px}
.bp{background:var(--accent);color:#fff}.bp:hover{background:#5a51e8;transform:translateY(-1px)}
.bp:active{transform:scale(.97)}
.btn:disabled{opacity:.35;cursor:default;transform:none!important}
.err{color:var(--red);font-size:.83rem;text-align:center;margin-top:7px;min-height:18px}
/* waiting */
.av{width:68px;height:68px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;font-size:1.9rem;margin:0 auto 14px}
.code-show{font-size:2.4rem;font-weight:800;letter-spacing:.3em;color:var(--accent);margin:8px 0}
.pulse{animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
/* question */
.tcirc{width:60px;height:60px;border-radius:50%;background:var(--card2);border:3px solid var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:1.3rem;font-weight:800;
  margin:0 auto 14px;transition:border-color .3s,color .3s}
.tcirc.warn{border-color:var(--yellow);color:var(--yellow)}
.tcirc.dang{border-color:var(--red);color:var(--red);animation:shk .25s infinite}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.qbar{height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-bottom:4px}
.qbarfill{height:100%;background:var(--accent);border-radius:2px;transition:width .1s linear}
.qtbox{background:var(--card2);border-radius:11px;padding:14px;margin-bottom:14px;
  font-size:1rem;font-weight:600;line-height:1.5;text-align:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.ob{padding:14px 10px;border-radius:11px;border:2px solid var(--border);background:var(--card2);
  color:var(--text);font-size:.92rem;font-weight:600;cursor:pointer;transition:all .14s;
  display:flex;align-items:center;gap:7px;text-align:left}
.ol{width:27px;height:27px;border-radius:7px;display:flex;align-items:center;justify-content:center;
  font-size:.78rem;font-weight:700;flex-shrink:0}
.ob:hover:not(:disabled){border-color:var(--accent);background:rgba(108,99,255,.12);transform:scale(1.02)}
.ob.sel{border-color:var(--accent);background:rgba(108,99,255,.2)}
.ob.cor{border-color:var(--green);background:rgba(74,222,128,.15);animation:bop .35s}
.ob.wrn{border-color:var(--red);background:rgba(248,113,113,.12);animation:shk2 .35s}
.ob:disabled{cursor:default}
@keyframes bop{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes shk2{0%,100%{transform:translateX(0)}30%{transform:translateX(-5px)}70%{transform:translateX(5px)}}
/* feedback */
.fbbox{text-align:center;padding:22px}
.fbi{font-size:3.8rem;animation:pop .35s}
@keyframes pop{0%{transform:scale(0)}80%{transform:scale(1.12)}100%{transform:scale(1)}}
.fbt{font-size:1.3rem;font-weight:800;margin:10px 0 4px}
.fbp{font-size:2.3rem;font-weight:800;color:var(--accent)}
.fbs{font-size:.9rem;color:var(--yellow);font-weight:600;margin-top:4px}
.fbtot{font-size:.85rem;color:var(--muted);margin-top:6px}
.wdots::after{content:'...';animation:ell 1.4s infinite}
@keyframes ell{0%{content:'.'}33%{content:'..'}66%,100%{content:'...'}}
/* podium */
.plb{text-align:left;margin-top:14px}
.plrow{display:flex;align-items:center;gap:9px;padding:9px 13px;background:var(--card2);
  border-radius:9px;margin-bottom:5px;font-size:.85rem}
.plrow.me{border:2px solid var(--accent);background:rgba(108,99,255,.12)}
.plrank{width:26px;text-align:center;font-weight:700;color:var(--muted)}
.plname{flex:1}
.plsc{font-weight:700;color:var(--accent)}
</style>
</head>
<body>

<!-- JOIN -->
<div class="scr" id="s-join">
  <div style="text-align:center;margin-bottom:24px">
    <h1>🎮 Yarışma</h1>
    <p style="color:var(--muted);font-size:.88rem;margin-top:4px">Hızlı ol, puanı kap!</p>
  </div>
  <div class="card">
    <div class="fg"><label>Oda Kodu</label>
      <input id="inp-code" placeholder="ABC123" maxlength="6"
        oninput="this.value=this.value.toUpperCase()"
        onkeydown="if(event.key==='Enter')document.getElementById('inp-name').focus()">
    </div>
    <div class="fg"><label>Adın</label>
      <input id="inp-name" placeholder="Adını gir" maxlength="20"
        onkeydown="if(event.key==='Enter')join()">
    </div>
    <button class="btn bp" id="joinbtn" onclick="join()">🚀 Katıl!</button>
    <div class="err" id="joinerr"></div>
  </div>
</div>

<!-- WAITING -->
<div class="scr hidden" id="s-wait">
  <div class="card" style="text-align:center;padding:28px">
    <div class="av" id="myav">🧑</div>
    <div id="myname-disp" style="font-size:1.2rem;font-weight:700"></div>
    <div style="color:var(--muted);font-size:.82rem;margin-top:3px">Oyuna katıldın!</div>
    <div style="margin:18px 0">
      <div style="font-size:.75rem;color:var(--muted)">Oda Kodu</div>
      <div class="code-show" id="code-disp"></div>
    </div>
    <div class="pulse" style="color:var(--muted);font-size:.88rem">
      Öğretmen oyunu başlatana kadar bekle<span class="wdots"></span>
    </div>
    <div id="wait-count" style="color:var(--muted);font-size:.8rem;margin-top:8px"></div>
  </div>
</div>

<!-- QUESTION -->
<div class="scr hidden" id="s-question">
  <div style="display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin-bottom:5px">
    <span>Soru <span id="qi">1</span>/<span id="qtot">?</span></span>
    <span id="qsc" style="font-weight:700;color:var(--accent)">0 puan</span>
  </div>
  <div class="qbar"><div class="qbarfill" id="qbf"></div></div>
  <div class="tcirc" id="tcirc">20</div>
  <div class="qtbox" id="qtext">...</div>
  <div class="opts" id="qopts"></div>
</div>

<!-- FEEDBACK -->
<div class="scr hidden" id="s-fb">
  <div class="card fbbox">
    <div class="fbi" id="fb-icon">🤔</div>
    <div class="fbt" id="fb-title"></div>
    <div class="fbp" id="fb-pts"></div>
    <div class="fbs" id="fb-streak"></div>
    <div class="fbtot" id="fb-tot"></div>
    <div style="color:var(--muted);font-size:.82rem;margin-top:14px">
      Sonraki soru bekleniyor<span class="wdots"></span>
    </div>
  </div>
</div>

<!-- PODIUM -->
<div class="scr hidden" id="s-podium">
  <div class="card" style="text-align:center;padding:24px">
    <div style="font-size:3rem" id="my-medal">🏅</div>
    <div style="font-size:1.2rem;font-weight:800;margin:6px 0" id="my-name-fin"></div>
    <div style="font-size:2rem;font-weight:800;color:var(--accent);margin-bottom:16px" id="my-score-fin"></div>
    <div class="plb" id="plb"></div>
    <button class="btn bp" style="margin-top:16px" onclick="location.reload()">🔄 Yeni Oyuna Katıl</button>
  </div>
</div>

<!-- ERROR -->
<div class="scr hidden" id="s-err">
  <div class="card" style="text-align:center;padding:28px">
    <div style="font-size:2.8rem;margin-bottom:12px">😕</div>
    <h2 id="err-title" style="margin-bottom:8px">Bağlantı Kesildi</h2>
    <p id="err-msg" style="color:var(--muted);font-size:.88rem;margin-bottom:18px"></p>
    <button class="btn bp" onclick="location.reload()">Tekrar Dene</button>
  </div>
</div>

<script>
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const AVATS = ['🧑','👩','🧑‍🎓','👨‍🎓','🦊','🐧','🦁','🐸','🤖','🦄','🐺','🐻','🦝','🐨'];
const CLRS  = ['#6c63ff','#ff6584','#43b89c','#f59e0b'];
const LBLS  = ['A','B','C','D'];
const MEDALS= {1:'🥇',2:'🥈',3:'🥉'};

let myId   = null;  // participant uuid
let myCode = null;
let myName = null;
let myScore= 0;
let myStreak=0;
let curRoom = null;
let answered= false;
let timerInt= null;
let qStart  = null;
let channel = null;

function showScreen(s) {
  ['join','wait','question','fb','podium','err'].forEach(n=>
    document.getElementById('s-'+n).classList.toggle('hidden',n!==s));
}
function showErr(title,msg){
  document.getElementById('err-title').textContent=title;
  document.getElementById('err-msg').textContent=msg;
  showScreen('err');
}

// ── Join ───────────────────────────────────────
async function join() {
  const code = document.getElementById('inp-code').value.trim().toUpperCase();
  const name = document.getElementById('inp-name').value.trim();
  if (!code) return setErr('Oda kodunu gir');
  if (!name || name.length<2) return setErr('En az 2 karakter isim gir');

  const btn = document.getElementById('joinbtn');
  btn.disabled=true; btn.textContent='Bağlanıyor...';

  // Oda var mı?
  const {data:room, error:re} = await sb.from('rooms').select('*').eq('code',code).single();
  if (re||!room) { btn.disabled=false; btn.textContent='🚀 Katıl!'; return setErr('Oda bulunamadı!'); }
  if (room.phase!=='lobby') { btn.disabled=false; btn.textContent='🚀 Katıl!'; return setErr('Oyun zaten başladı!'); }

  // Kayıt
  const {data:p, error:pe} = await sb.from('participants').insert({room_code:code,name}).select().single();
  if (pe) {
    btn.disabled=false; btn.textContent='🚀 Katıl!';
    return setErr(pe.code==='23505' ? 'Bu isim zaten kullanılıyor!' : 'Katılım başarısız!');
  }

  myId=p.id; myCode=code; myName=name; curRoom=room;
  document.getElementById('myname-disp').textContent=name;
  document.getElementById('code-disp').textContent=code;
  document.getElementById('myav').textContent=AVATS[Math.floor(Math.random()*AVATS.length)];
  subscribeRoom();
  showScreen('wait');
}

function setErr(msg){
  document.getElementById('joinerr').textContent=msg;
  setTimeout(()=>document.getElementById('joinerr').textContent='',3000);
}

// ── Room Subscription ──────────────────────────
function subscribeRoom() {
  channel = sb.channel('student-'+myCode+'-'+myId)
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'rooms',filter:`code=eq.${myCode}`},
      (pl)=>handleRoom(pl.new))
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'participants',filter:`room_code=eq.${myCode}`},
      (pl)=>{ document.getElementById('wait-count').textContent = ''; })
    .subscribe();
}

function handleRoom(room) {
  curRoom = room;
  if (room.phase==='question') {
    const idx = room.current_question;
    const q   = room.questions[idx];
    if (!q) return;
    answered = false;
    qStart   = new Date(room.question_start_time).getTime();
    showQuestion(q, idx, room.questions.length, room.settings||{});
  } else if (room.phase==='results') {
    clearInterval(timerInt);
    if (!answered) showTimedOut();
  } else if (room.phase==='podium') {
    clearInterval(timerInt);
    fetchAndShowPodium();
  }
}

// ── Question ───────────────────────────────────
function showQuestion(q, idx, total, settings) {
  document.getElementById('qi').textContent   = idx+1;
  document.getElementById('qtot').textContent = total;
  document.getElementById('qsc').textContent  = myScore.toLocaleString()+' puan';
  document.getElementById('qtext').textContent= q.text;

  document.getElementById('qopts').innerHTML = (q.options||[]).map((o,i)=>`
    <button class="ob" id="ob${i}" onclick="answer('${i}',${JSON.stringify(q).replace(/'/g,"\\'")})"
      style="background:var(--card2)">
      <div class="ol" style="background:${CLRS[i%CLRS.length]}22;color:${CLRS[i%CLRS.length]}">${LBLS[i]||i}</div>
      <span>${o}</span>
    </button>`).join('');

  startTimer(q.timeLimit || (settings.timePerQuestion||20));
  showScreen('question');
}

function startTimer(secs) {
  clearInterval(timerInt);
  let rem = secs;
  const circ = document.getElementById('tcirc');
  const fill = document.getElementById('qbf');
  circ.textContent=secs; circ.className='tcirc'; fill.style.width='100%';
  timerInt = setInterval(()=>{
    rem-=.1;
    fill.style.width=Math.max(0,rem/secs*100)+'%';
    circ.textContent=Math.ceil(rem);
    if (rem<=5) circ.className='tcirc dang';
    else if (rem<=10) circ.className='tcirc warn';
    if (rem<=0) { clearInterval(timerInt); if(!answered){answered=true;disableOpts();} }
  },100);
}

function disableOpts() {
  document.querySelectorAll('.ob').forEach(b=>b.disabled=true);
}

async function answer(val, q) {
  if (answered) return;
  answered = true;
  disableOpts();
  document.getElementById('ob'+val)?.classList.add('sel');

  const timeTaken  = Date.now() - qStart;
  const isCorrect  = String(val) === String(q.correct);
  const settings   = curRoom?.settings || {};
  const maxPts     = settings.maxPoints || 1000;
  const minPts     = settings.minPoints || 100;
  const timeLimit  = (q.timeLimit || settings.timePerQuestion || 20) * 1000;
  let earned = 0;

  if (isCorrect) {
    const frac = Math.min(timeTaken/timeLimit, 1);
    earned = Math.round(maxPts - (maxPts-minPts)*frac);
    if (settings.streakBonus) {
      myStreak++;
      const mult = Math.min(1 + (myStreak-1)*0.1, 2.0);
      earned = Math.round(earned*mult);
    }
    myScore += earned;
  } else {
    myStreak = 0;
  }

  // Highlight correct
  document.getElementById('ob'+q.correct)?.classList.add('cor');
  if (!isCorrect) document.getElementById('ob'+val)?.classList.add('wrn');

  // Save answer
  await sb.from('answers').insert({
    room_code: myCode, participant_id: myId,
    question_index: curRoom.current_question,
    answer: val, is_correct: isCorrect,
    earned_points: earned, time_taken_ms: timeTaken
  });
  // Update score
  await sb.from('participants').update({score:myScore,streak:myStreak}).eq('id',myId);

  setTimeout(()=>{
    document.getElementById('fb-icon').textContent = isCorrect ? '🎉' : '😞';
    document.getElementById('fb-title').style.color = isCorrect ? 'var(--green)' : 'var(--red)';
    document.getElementById('fb-title').textContent = isCorrect ? 'Doğru!' : 'Yanlış!';
    document.getElementById('fb-pts').textContent   = isCorrect ? '+'+earned.toLocaleString() : '';
    document.getElementById('fb-streak').textContent= myStreak>1 ? `🔥 ${myStreak} seri! ×${Math.min(1+(myStreak-1)*.1,2).toFixed(1)}` : '';
    document.getElementById('fb-tot').textContent   = `Toplam: ${myScore.toLocaleString()} puan`;
    showScreen('fb');
  }, 450);
}

function showTimedOut() {
  document.getElementById('fb-icon').textContent = '⏰';
  document.getElementById('fb-title').style.color= 'var(--yellow)';
  document.getElementById('fb-title').textContent= 'Süre Doldu!';
  document.getElementById('fb-pts').textContent  = '';
  document.getElementById('fb-streak').textContent='';
  document.getElementById('fb-tot').textContent  = `Toplam: ${myScore.toLocaleString()} puan`;
  myStreak = 0;
  showScreen('fb');
}

// ── Podium ─────────────────────────────────────
async function fetchAndShowPodium() {
  const {data:lb} = await sb.from('participants').select('name,score').eq('room_code',myCode).order('score',{ascending:false});
  const list = lb||[];
  const rank = list.findIndex(p=>p.name===myName)+1;
  document.getElementById('my-medal').textContent   = MEDALS[rank]||`#${rank}`;
  document.getElementById('my-name-fin').textContent= myName;
  document.getElementById('my-score-fin').textContent= myScore.toLocaleString()+' puan';
  document.getElementById('plb').innerHTML = list.map((p,i)=>`
    <div class="plrow ${p.name===myName?'me':''}">
      <span class="plrank">${MEDALS[i+1]||i+1}</span>
      <span class="plname">${p.name}</span>
      <span class="plsc">${(p.score||0).toLocaleString()}</span>
    </div>`).join('');
  showScreen('podium');
}
</script>
</body>
</html>
