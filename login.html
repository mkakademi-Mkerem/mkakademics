<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mkakademics – Giriş</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 60%,#0f0f23 100%);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
:root{--accent:#e040fb;--card:#16213e;--red:#e21b3c;}
.container{width:100%;max-width:400px;}
.logo{font-size:2.2rem;font-weight:900;background:linear-gradient(to right,var(--accent),#7c4dff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center;margin-bottom:6px;}
.subtitle{text-align:center;color:#888;font-size:.9rem;margin-bottom:36px;}
.card{background:var(--card);border-radius:20px;padding:32px;border:1px solid #2a2a4a;}
.card h2{font-size:1.1rem;margin-bottom:24px;color:#ccc;font-weight:600;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:.8rem;color:#888;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;}
.field input{width:100%;background:#0f0f23;border:2px solid #2a2a4a;color:#fff;padding:12px 16px;border-radius:12px;font-size:1rem;outline:none;transition:border-color .2s;}
.field input:focus{border-color:var(--accent);}
.field input::placeholder{color:#444;}
.btn-login{width:100%;padding:14px;background:linear-gradient(135deg,var(--accent),#7c4dff);color:#fff;border:none;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;transition:all .2s;margin-top:8px;letter-spacing:.3px;}
.btn-login:hover{opacity:.9;transform:translateY(-1px);}
.btn-login:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.err{color:var(--red);font-size:.85rem;text-align:center;margin-top:12px;min-height:20px;}
.back{text-align:center;margin-top:20px;}
.back a{color:#555;font-size:.82rem;text-decoration:none;}
.back a:hover{color:#aaa;}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="container">
  <div class="logo">mkakademics</div>
  <div class="subtitle">Öğretmen & Yönetici Girişi</div>
  <div class="card">
    <h2>🔐 Hesabınıza giriş yapın</h2>
    <div class="field">
      <label>Kullanıcı Adı</label>
      <input type="text" id="inp-username" placeholder="kullaniciadi" autocomplete="username" autocapitalize="none" autocorrect="off">
    </div>
    <div class="field">
      <label>Şifre</label>
      <input type="password" id="inp-password" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="btn-login" id="btn-login" onclick="doLogin()">Giriş Yap</button>
    <div class="err" id="err-msg"></div>
  </div>
  <div class="back"><a href="/">← Ana Sayfaya Dön</a></div>
</div>

<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Zaten giriş yapılmışsa yönlendir
(function(){
  const sess = getSession();
  if(sess){
    redirectAfterLogin(sess.role);
  }
})();

async function sha256(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function doLogin(){
  const username = document.getElementById('inp-username').value.trim().toLowerCase();
  const password = document.getElementById('inp-password').value;
  const errEl = document.getElementById('err-msg');
  const btn = document.getElementById('btn-login');

  errEl.textContent='';
  if(!username){errEl.textContent='Kullanıcı adı gerekli.';return;}
  if(!password){errEl.textContent='Şifre gerekli.';return;}

  btn.disabled=true;
  btn.innerHTML='<span class="spinner"></span>Kontrol ediliyor…';

  const hash = await sha256(password);

  const{data,error}=await sb.from('users').select('id,username,role,full_name').eq('username',username).eq('password_hash',hash).single();

  if(error||!data){
    errEl.textContent='❌ Kullanıcı adı veya şifre hatalı.';
    btn.disabled=false;
    btn.textContent='Giriş Yap';
    return;
  }

  // Session kaydet
  const session={id:data.id,username:data.username,role:data.role,fullName:data.full_name||data.username,ts:Date.now()};
  localStorage.setItem('mk_session',JSON.stringify(session));

  redirectAfterLogin(data.role);
}

function redirectAfterLogin(role){
  const next=new URLSearchParams(window.location.search).get('next');
  if(next) window.location.href=next;
  else if(role==='admin') window.location.href='/admin';
  else window.location.href='/teacher';
}

function getSession(){
  try{
    const s=JSON.parse(localStorage.getItem('mk_session')||'null');
    if(!s)return null;
    // 24 saat geçerli
    if(Date.now()-s.ts>86400000){localStorage.removeItem('mk_session');return null;}
    return s;
  }catch{return null;}
}
</script>
</body>
</html>
